[package]
name = "aquaregia-example-claude-code"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aquaregia = { path = "../.." }
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync"] }
unicode-width = "0.2"
